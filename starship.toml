palette = "noctalia"

format = """
[░▒▓](magenta)\
$os\
[](fg:magenta bg:green)\
$directory\
[](fg:green bg:yellow)\
$git_branch\
$git_status\
[](fg:yellow bg:blue)\
$nodejs\
$bun\
$rust\
$golang\
$python\
$php\
$c\
$docker_context\
[](fg:blue bg:black)\
$cmd_duration\
$time\
[ ](fg:black)\
\n$character"""

[os]
disabled = false
style = "bg:magenta fg:black"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇 "
Artix = "󰣇 "
EndeavourOS = "󰣇 "
Manjaro = "󱘊 "
Ubuntu = "󰕈 "
Debian = "󰣚 "
Fedora = "󰣛 "
Gentoo = "󰣨 "
Alpine = "󰣢 "
Pop = "󰒔 "
Linux = "󰌽 "
Macos = "󰀵 "
Windows = "󰍲 "
Android = "󰀲 "
CentOS = "󰣛 "
SUSE = "󰣛 "
Raspbian = "󰐿 "
Mint = "󰣚 "
Redhat = "󰣛 "
RedHatEnterprise = "󰣛 "

[directory]
style = "fg:black bg:green"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Desktop" = "󰇄 "
"Documents" = "󰈙 "
"Downloads" = "󰇚 "
"Music" = "󰝚 "
"Pictures" = "󰋩 "
"Videos" = "󰕧 "

[git_branch]
symbol = " "
style = "bg:yellow"
format = '[[ $symbol$branch ](fg:black bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[ $all_status$ahead_behind](fg:black bg:yellow)]($style)'
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "󰋗 "
stashed = " "
modified = "󰛿 "
staged = "󰐖 "
renamed = "󰑕 "
deleted = "󰍵 "

[nodejs]
symbol = "󰎙 "
style = "bg:blue"
format = '[[ $symbol($version) ](fg:black bg:blue)]($style)'

[bun]
symbol = "󰒋 "
style = "bg:blue"
format = '[[ $symbol($version) ](fg:black bg:blue)]($style)'

[rust]
symbol = "󱘗 "
style = "bg:blue"
format = '[[ $symbol($version) ](fg:black bg:blue)]($style)'

[golang]
symbol = "󰟓 "
style = "bg:blue"
format = '[[ $symbol($version) ](fg:black bg:blue)]($style)'

[python]
symbol = "󰌠 "
style = "bg:blue"
format = '[[ $symbol($version) ](fg:black bg:blue)]($style)'

[php]
symbol = "󰌟 "
style = "bg:blue"
format = '[[ $symbol($version) ](fg:black bg:blue)]($style)'

[c]
symbol = "󰙲 "
style = "bg:blue"
format = '[[ $symbol($version) ](fg:black bg:blue)]($style)'

[docker_context]
symbol = "󰡨 "
style = "bg:blue"
format = '[[ $symbol($version) ](fg:black bg:blue)]($style)'

[cmd_duration]
min_time = 2_000
style = "bg:black"
format = '[[ 󱐋 $duration ](fg:yellow bg:black)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:black"
format = '[[  $time ](fg:white bg:black)]($style)'

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

